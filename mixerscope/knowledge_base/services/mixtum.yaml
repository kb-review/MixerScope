      web_storage: "not_stored_by_design: page scripts make no storage calls"
      autofill: "not_stored_by_design: the forms carry autocomplete=off, and no row was saved for the typed addresses"
      sessions: "recovered: forward_addr in the mix-mode POST body; absent for the amount-mode order, whose submission was re-posted through the CDN challenge with the token as its only body field"
      filesystem: "recovered: letter body (destination and, in the amount mode, change address)"
      replay: "not_tested: every replayed request was answered by the CDN challenge"
