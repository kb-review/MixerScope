# =============================================================================
# MixerScope KB entry: Mixtum                                     schema_version 0.4
# =============================================================================
# INVARIANTS ONLY. No value from any order appears here; order-specific values are
# placeholders (<btc_address>, <order_id>, <txid_hex64>, ...). Service-level literals
# (signing key, onion) are InvariantLiterals with a justification.
# =============================================================================
schema_version: "0.4"

service:
  id: mixtum
  display_name: Mixtum
  entry_status: reviewed
  tiers_completed: [0]
  analysts: [analyst]
  first_analyzed: "2026-10"
  validity_default: {first_seen: "2026-10", last_seen: "2026-10", status: current}

# --- Observations: every source a value may cite ------------------------------------------
observations:
  - id: mt-flow
    kind: capture_flow
    provenance_class: instrumentation
    tier: 0
    date: "2026-10-29"
    os: Windows 10
    browser_version: Chrome 156
    case_ref: "proxy capture of the tier-0 run"
    notes: "Proxy capture of twelve minutes (50 exchanges, 28 to mixtum.io): home page, the order form, one order in the mix mode (Complete anonymity), one order in the amount mode (Precise Payment), each answered by the order page that embeds the Letter of Guarantee; two Cloudflare managed challenges (one on a page load, one on the amount-mode submission) and the challenge resubmissions. No status lookup exists to capture. The browser version is the capture's User-Agent. The analyst had rehearsed the same procedure before starting the proxy, so the profile holds earlier activity this capture does not cover (notes.yaml)."
  - id: mt-policy
    kind: operator_page
    provenance_class: operator_claim
    tier: 0
    date: "2026-10"
    case_ref: "FAQ (/en/faq) and home page (/en) saved on 2026-10-30; operator statements printed on the home page, the order form, the order page and in the Letter of Guarantee as served during the capture of 2026-10-29"
  - id: mt-disk
    kind: disk_image
    provenance_class: subject_evidence
    tier: 0
    date: "2026-10-29"
    os: Windows 10
    browser_version: Chrome 156
    case_ref: "Chrome profile and Downloads folder exported from the image of the capture VM"
    conditions: "Chrome closed normally; VM shut down normally before acquisition. The profile also holds the analyst's rehearsal of the same procedure on the evening before and the morning of the capture, without the proxy: visits, two earlier letter downloads (test mode and mix mode) in the download rows, and one earlier mix-mode POST body in session restore; the Downloads folder holds the capture's two letters. The analyst viewed the capture in the mitmproxy web interface inside the same profile; its History rows and cache entries (127.0.0.1:8081) are instrumentation and were excluded from every disk claim."
    notes: "Examined read-only, with a byte search for every order value of the capture, each hit attributed to the record that holds it."
  - id: mt-replay
    kind: replay
    provenance_class: instrumentation
    tier: 0
    date: "2026-10-30"
    case_ref: "all 28 recorded service requests replayed with their recorded cookies, headers and bodies about 16 hours after the capture (variant original only)"
    notes: "Every replayed request to the service, including those carrying the recorded cf_clearance cookie, was answered by Cloudflare's challenge page (403, cf-mitigated: challenge) and the replayed challenge resubmissions got 404. The origin was never reached, so the replay says nothing about what the service still held."

# --- 1. Identity -------------------------------------------------------------------------
identity:
  domains:
    - domain: mixtum.io
      role: canonical
      attr: {tier: 0, basis: observed, sources: [mt-flow, mt-policy], notes: "All captured traffic, pages and assets went to this host; pages are served under /en, /ru and /de."}
    - domain: mixtumjzn2tsiusfkdhutntamspsg43kgt764qbdaxjebce4h6fcfiad.onion
      role: onion
      attr: {tier: 0, basis: claimed, sources: [mt-policy], notes: "'TOR Mirror' link in the header and footer of every page."}
  cdn_proxy:
    value: cloudflare
    tier: 0
    basis: observed
    sources: [mt-flow, mt-disk]
    notes: "server: cloudflare, cf-ray and cf-cache-status on every response; managed challenge (cf-mitigated: challenge, /cdn-cgi/challenge-platform) with the cf_clearance cookie, which is the only cookie in the Cookies DB for the host; Cloudflare Turnstile state in Local Storage under the challenges.cloudflare.com origin; rocket-loader and the Cloudflare Insights beacon on the pages."
  framework:
    name:
      value: "Jambler.io mixing platform behind a MixTum-branded front end"
      tier: 0
      basis: inferred
      sources: [mt-flow, mt-policy]
      notes: "Inferred from the signals below; the operator says 'Powered by Jambler.io' but not what that covers. No server-side technology is visible: extension-less paths, no application cookie, no X-Powered-By header."
    signals:
      - "'Powered by Jambler.io' with a link to jambler.io in the footer of every page"
      - "Letter of Guarantee signed with GnuPG v2.0.22 (GNU/Linux) in the Jambler letter format"
      - "'PGP Checker' link to bitlist.co/service/mixtum/verify-pgp for letter verification"
  client_ip_leak:
    present:
      value: false
      tier: 0
      basis: observed
      sources: [mt-flow, mt-disk]
      notes: "No cookie, page or letter carries the client's IP address; the cf_clearance value is opaque. The client IP is therefore not known from the evidence and could not be searched for on the export."

# --- 2. Access and modes -----------------------------------------------------------------
access:
  account_model:
    value: account_less
    tier: 0
    basis: observed
    sources: [mt-flow, mt-policy]
    notes: "No registration, login, session cookie or user code: the home page says 'There is no need in using mixer-codes' and 'We do not attribute ID tracking numbers to your orders'."
  kyc: {value: false, tier: 0, basis: observed, sources: [mt-flow, mt-policy], notes: "Nothing is asked beyond the addresses (and the amount in the amount mode); the service advertises itself on kycnot.me."}

modes:
  - id: mix
    page_paths: ["/en/mix", "/en/mix?mode=mix"]
    chain_flow:
      value: "BTC -> intermediary wallets topped up from investors' exchange accounts -> BTC to one or two forwarding addresses in two or more transactions of random sums ('Complete anonymity')"
      tier: 0
      basis: claimed
      sources: [mt-policy]
      notes: "Home page 'How does it work'; not exercised, no deposit was made."
    limits:
      min: {value: "0.001 BTC", tier: 0, basis: claimed, sources: [mt-policy], notes: "FAQ 7; the order page prints '(MIN 0.001, MAX 50 BTC)'."}
      max: {value: "50 BTC per request", tier: 0, basis: claimed, sources: [mt-policy], notes: "FAQ 8; the order page prints '(MIN 0.001, MAX 50 BTC)'."}
    fee_model:
      value: "Set by the service, not chosen by the user: 'random 4 - 5% + 0.0007 BTC' on the order form; the FAQ says the commission 'is randomized to some extent and can be 4-5% + 0.0007 BTC (network fee)'; the letter states 'Maximum service fee is: 5% + 0.0007 BTC'"
      tier: 0
      basis: claimed
      sources: [mt-policy]
    delay_options:
      value: "None offered: the service chooses the delay ('We do not allow clients to set mixing time frames'); 'Time of return is up to 6 hours' on the form, 'from 1 to 6 hours' on the home page, 'Maximum mixing time is 6 hours' in the letter"
      tier: 0
      basis: claimed
      sources: [mt-policy]
    order_params: [level, forward_addr, forward_addr2]
    attr:
      tier: 0
      basis: observed
      sources: [mt-flow]
      notes: "Form at /en/mix (also reached as /en/mix?mode=mix): hidden level=3, forward_addr (required, maxlength 62), forward_addr2 (optional). The letter names the mode 'Complete anonymity'. The form carries autocomplete=off."
  - id: amount
    page_paths: ["/en/mix?mode=amount"]
    chain_flow:
      value: "BTC -> service -> exactly the requested amount to the destination address and the remainder to a change address ('Precise Payment')"
      tier: 0
      basis: claimed
      sources: [mt-policy]
      notes: "Form text: 'the amount, the destination address to transfer this amount to, and the change address for any funds left over after anonymization'. Not exercised."
    limits:
      min: {value: "0.001 BTC payment amount (form input min)", tier: 0, basis: observed, sources: [mt-flow], notes: "min attribute of the forward_amount input; the order page then prints a deposit window '(MIN: <amount>; MAX: <amount> BTC)' computed from the requested amount."}
      max: {value: "50 BTC payment amount (form input max)", tier: 0, basis: observed, sources: [mt-flow]}
    fee_model:
      value: "Same as the mix mode: 'random 4 - 5% + 0.0007 BTC' on the form, 'The maximum service fee is: 5% + 0.0007 BTC' in the letter"
      tier: 0
      basis: claimed
      sources: [mt-policy]
    delay_options:
      value: "None offered; 'The maximum mixing time is 6 hours' in the letter"
      tier: 0
      basis: claimed
      sources: [mt-policy]
    order_params: [level, forward_amount, forward_addr, forward_addr2]
    attr:
      tier: 0
      basis: observed
      sources: [mt-flow]
      notes: "Form at /en/mix?mode=amount: hidden level=2, forward_amount (number, step 0.00000001), forward_addr (destination, required), forward_addr2 (change address, required). The letter names the mode 'Precise Payment'. Advertised on the home page as 'the new mixing mode'. The form carries autocomplete=off."
  - id: test
    page_paths: ["/en/mix?mode=test"]
    limits:
      min: {value: "exactly 0.001 BTC, one output address", tier: 0, basis: claimed, sources: [mt-policy], notes: "FAQ 10 and home page 'Free trial'."}
      max: {value: "exactly 0.001 BTC", tier: 0, basis: claimed, sources: [mt-policy]}
    fee_model: {value: "No commission for the trial", tier: 0, basis: claimed, sources: [mt-policy], notes: "FAQ 10."}
    delay_options: {tier: 0, basis: unknown, notes: "Not stated separately for the trial."}
    order_params: []
    attr:
      tier: 0
      basis: observed
      sources: [mt-flow]
      notes: "Seen in the capture only as the 'Try Now For Free' link on the home page; the trial form was not fetched through the proxy (the analyst's rehearsal used it, see mt-disk). Its field names and hidden level value are unknown."

# --- 3. Order model ----------------------------------------------------------------------
order_model:
  identifiers:
    - name: deposit_address
      fact: deposit_address
      scheme: {regex: '^<btc_address>$', describes: deposit_address}
      derivation:
        value: "Fresh service-controlled address per order (P2SH in both samples), printed on the order page with a QR code and in the letter; the service assigns no order number ('We do not attribute ID tracking numbers to your orders') and the FAQ tells the user to monitor this address on a block explorer"
        tier: 0
        basis: observed
        sources: [mt-flow, mt-policy]
      role:
        value: display_only
        tier: 0
        basis: observed
        sources: [mt-flow]
        notes: "There is no status or lookup endpoint to query it with; it is the only per-order identifier the user receives."
      exposed_in: [filesystem]
      attr: {tier: 0, basis: observed, sources: [mt-flow, mt-disk]}

# --- 4. Session --------------------------------------------------------------------------
cookies:
  - name: cf_clearance
    set_by: cdn
    purpose:
      value: "Cloudflare challenge clearance, issued after the browser solved a managed challenge; the service itself sets no cookie"
      tier: 0
      basis: observed
      sources: [mt-flow]
    flags:
      value: ["Domain=mixtum.io", "Path=/", HttpOnly, Secure, "SameSite=None", Partitioned, "Expires=<1 year ahead>"]
      tier: 0
      basis: observed
      sources: [mt-flow]
    client_max_age: {value: "1 year", tier: 0, basis: observed, sources: [mt-flow, mt-disk]}
    rotation_interval:
      value: "Re-issued at every solved challenge"
      tier: 0
      basis: observed
      sources: [mt-flow]
    server_side_validity:
      value: "About 16 hours later the recorded cookie no longer cleared the challenge: every replayed request was answered with the challenge page"
      tier: 0
      basis: inferred
      sources: [mt-replay]
      notes: "Consistent with the clearance being bound to the client's network fingerprint (the replay came through the proxy from a different client) or with a server-side lifetime far shorter than the cookie's one year; the replay cannot tell which."
    persists_to_disk:
      value: true
      tier: 0
      basis: observed
      sources: [mt-disk]
      notes: "Row present for .mixtum.io with a one-year expiry, value encrypted. The only row for the host."
    encodes_fact: []
    attr: {tier: 0, basis: observed, sources: [mt-flow, mt-disk]}

# --- 5. Endpoints ------------------------------------------------------------------------
endpoints:
  - id: home
    method: GET
    path: {regex: '^/(en|ru|de)?$'}
    purpose: "Home page in three languages; links the order form ('Mix My Coins' -> /en/mix), the trial (/en/mix?mode=test) and the amount mode (/en/mix?mode=amount); prints the PGP fingerprint and the onion"
    gate: {value: [], tier: 0, basis: observed, sources: [mt-flow]}
    cache_policy:
      value: cacheable_heuristic
      tier: 0
      basis: observed
      sources: [mt-flow, mt-disk]
      notes: "No Cache-Control header (cf-cache-status: DYNAMIC); copies of /, /en and the assets found in the Cache_Data folder. The page carries no order value."
    content_encoding: {value: zstd, tier: 0, basis: observed, sources: [mt-flow]}
    attr: {tier: 0, basis: observed, sources: [mt-flow]}
  - id: order_form
    method: GET
    path: {regex: '^/(en|ru|de)/mix$'}
    purpose: "Order form; the mode query parameter selects the form (none or mix: two addresses; amount: amount, destination and change address; test: trial). The form posts to the same path and mode"
    request_fields: [mode]
    field_facts: {mode: mix_mode}
    gate: {value: [], tier: 0, basis: observed, sources: [mt-flow], notes: "One load of /en/mix?mode=mix was intercepted by the Cloudflare managed challenge; the challenge is the CDN's decision, not a service gate."}
    cache_policy:
      value: cacheable_heuristic
      tier: 0
      basis: observed
      sources: [mt-flow, mt-disk]
      notes: "No Cache-Control header; cached copies of /en/mix and /en/mix?mode=test found. The form pages carry no order value, only the chosen mode in the URL."
    content_encoding: {value: zstd, tier: 0, basis: observed, sources: [mt-flow]}
    response_templates:
      - {text: "Enter your Bitcoin forward to address below:", yields: []}
      - {text: "Please enter below: the amount, the destination address to transfer this amount to, and the change address for any funds left over after anonymization", yields: []}
      - {text: "A generated address is valid for 7 days (see FAQ)", yields: []}
    attr: {tier: 0, basis: observed, sources: [mt-flow]}
  - id: create_order
    method: POST
    path: {regex: '^/(en|ru|de)/mix$'}
    purpose: "Creates the order from the form (query: mode=mix|amount|test) and answers with the order page: deposit address with QR code, destination address(es), a hidden field holding the complete PGP-signed Letter of Guarantee, a 'Download Letter of Guarantee' button that saves that field as a Blob, and a 'Send More Coins' link back to the form. No order number, no status element"
    request_fields: [mode, level, forward_addr, forward_addr2, forward_amount, "<hex>"]
    field_facts: {mode: mix_mode, level: mix_mode, forward_addr: destination_address, forward_addr2: destination_address, forward_amount: amounts}
    gate:
      value: [cdn_challenge]
      tier: 0
      basis: observed
      sources: [mt-flow, mt-replay]
      notes: "Not a service gate: Cloudflare's managed challenge (Turnstile) intercepted the amount-mode submission (403, cf-mitigated: challenge); after the challenge the browser re-posted with the clearance cookie and a single hidden field named by a 64-hex id (the <hex> field) carrying the challenge token, and Cloudflare forwarded the original form fields to the origin. The mix-mode submission went through directly. Every replayed submission 16 hours later was challenged."
    cache_policy:
      value: cacheable_heuristic
      tier: 0
      basis: observed
      sources: [mt-flow, mt-disk]
      notes: "No Cache-Control header on the POST response. No order page was found in the cache. Inferred reason: Chrome normally does not reuse POST responses."
    content_encoding: {value: zstd, tier: 0, basis: observed, sources: [mt-flow]}
    response_templates:
      - {text: "We will transfer your BTC in one or multiple transactions to the destination addresses <btc_address>", yields: [destination_address]}
      - {text: "We will transfer <amount_btc> BTC in one or multiple transactions to the destination address <btc_address>", yields: [amounts, destination_address]}
      - {text: "and the change to this address: <btc_address>", yields: [destination_address]}
      - {text: "Please send your bitcoins (MIN 0.001, MAX 50 BTC) to the address: <btc_address>", yields: [deposit_address]}
      - {text: "Please send your bitcoins (MIN: <amount_btc>; MAX: <amount_btc> BTC ) to the address: <btc_address>", yields: [amounts, amounts, deposit_address]}
      - {text: "Download Letter of Guarantee", yields: []}
      - {text: "Send More Coins", yields: []}
    replay_results:
      - variant: original
        reply: {text: "Just a moment... Enable JavaScript and cookies to continue", yields: []}
        reading: "Answered by the Cloudflare challenge page; the submission never reached the service, so neither a new order nor a refusal was observed"
        outcome: {value: rejected, tier: 0, basis: observed, sources: [mt-replay]}
    attr:
      tier: 0
      basis: observed
      sources: [mt-flow]
      notes: "The order page is the POST response; a reload would resubmit the form. The deposit window in the amount mode is computed by the service from the requested amount. The page title changes from 'Create New Order' to 'Created New Order'."
  - id: cdn_challenge
    method: POST
    path: {regex: '^/cdn-cgi/challenge-platform/h/g/fo/<text>$'}
    purpose: "Cloudflare managed-challenge submission on the service host (preceded by GET /cdn-cgi/challenge-platform/h/g/orchestrate/chl_page/v1?ray=<hex>); the second response sets cf_clearance, after which the browser re-posts the intercepted request"
    gate: {value: [], tier: 0, basis: observed, sources: [mt-flow]}
    cache_policy: {value: no_store, tier: 0, basis: observed, sources: [mt-flow], notes: "The orchestrate script is served private, no-store; the challenge POSTs carry no cache header."}
    content_encoding: {value: zstd, tier: 0, basis: observed, sources: [mt-flow]}
    replay_results:
      - variant: original
        reply: {text: "HTTP 404 with an empty body", yields: []}
        reading: "The recorded challenge submissions are single-use: replayed 16 hours later they got 404"
        outcome: {value: rejected, tier: 0, basis: observed, sources: [mt-replay]}
    attr: {tier: 0, basis: observed, sources: [mt-flow], notes: "CDN infrastructure, recorded because it decides whether a replayed or scripted request reaches the service at all."}

# --- 6. Status ---------------------------------------------------------------------------
status:
  mechanism:
    value: none
    tier: 0
    basis: observed
    sources: [mt-flow, mt-policy]
    notes: "The order page has no status element, no polling script and no lookup form; no endpoint takes an order identifier. The FAQ tells the user to monitor the deposit address on a block explorer ('My browser crashed before I could get a confirmation on my transfer!'). The only onward link is 'Send More Coins' back to the form."
  states: []
  replay_behavior:
    value: "Nothing to replay: the replay reached only the CDN challenge"
    tier: 0
    basis: observed
    sources: [mt-replay]

# --- 7. Receipts -------------------------------------------------------------------------
receipts:
  - id: letter_of_guarantee
    name: Letter of Guarantee
    offered:
      value: always
      tier: 0
      basis: observed
      sources: [mt-flow]
      notes: "Generated for every order and embedded in the order page as the value of a hidden input (name guarantee-letter); saving it to a file needs the 'Download Letter of Guarantee' click."
    obtained_via:
      endpoint_ref: create_order
      request_params: []
      delivery:
        value: client_blob
        tier: 0
        basis: observed
        sources: [mt-flow, mt-disk]
        notes: "Page script wraps the hidden field in a Blob (type text/plain), creates an object URL and clicks an anchor with download=MixTum_guarantee_letter.txt; the download's URL chain in History is a blob: URL. No request is made."
      cache_policy: {value: no_store, tier: 0, basis: observed, sources: [mt-flow, mt-disk], notes: "Nothing is fetched; the letter exists only inside the uncached POST response and in the downloaded file."}
    file:
      filename_pattern: {regex: '^MixTum_guarantee_letter\.txt$'}
      mime_type: {value: text/plain, tier: 0, basis: observed, sources: [mt-flow, mt-disk], notes: "Blob type and the download row's mime_type."}
      encoding: {value: "UTF-8, LF line endings", tier: 0, basis: observed, sources: [mt-disk]}
    structure:
      container: {value: pgp_clearsigned, tier: 0, basis: observed, sources: [mt-disk]}
      container_notes: "PGP clearsigned message (Hash: SHA1) with an RSA signature made by GnuPG v2.0.22. The two modes print different wordings (templates below). The file name is fixed for every order."
      templates:
        - text: |-
            -----BEGIN PGP SIGNED MESSAGE-----
            Hash: SHA1

            MixTum has generated the address:  <btc_address>
            Mixing mode: Complete anonymity.
            Cleansed coins will be sent to the forwarding address:
            <btc_address>

            Maximum mixing time is 6  hours.
            This offer is valid for 168  hours from <datetime>  GMT
            Maximum service fee is: 5% + 0.0007 BTC.
            PGP fingerprint: 63DFE7F602E8C7D50B1D2340FDAEC8327BBC8E99.
            -----BEGIN PGP SIGNATURE-----
            Version: GnuPG v2.0.22 (GNU/Linux)

            <signature>
            -----END PGP SIGNATURE-----
          yields: [deposit_address, destination_address, order_created_time]
          literals:
            - {literal: 63DFE7F602E8C7D50B1D2340FDAEC8327BBC8E99, justification: "Fingerprint printed in every letter; service-level, not per order. It differs from the fingerprint the site publishes (see signature notes)."}
        - text: |-
            -----BEGIN PGP SIGNED MESSAGE-----
            Hash: SHA1

            MixTum has generated the address: <btc_address>.
            Operation mode: Precise Payment.
            Anonymized coins will be sent to the destination address: <btc_address>,
            the change will be sent to the address: <btc_address>.
            The maximum mixing time is 6 hours.
            This offer is valid for 168 hours, starting from <datetime> GMT.
            The maximum service fee is: 5% + 0.0007 BTC.
            Our PGP fingerprint: 63DFE7F602E8C7D50B1D2340FDAEC8327BBC8E99.
            -----BEGIN PGP SIGNATURE-----
            Version: GnuPG v2.0.22 (GNU/Linux)

            <signature>
            -----END PGP SIGNATURE-----
          yields: [deposit_address, destination_address, destination_address, order_created_time]
          literals:
            - {literal: 63DFE7F602E8C7D50B1D2340FDAEC8327BBC8E99, justification: "Fingerprint printed in every letter; service-level, not per order."}
    signature:
      scheme:
        value: pgp
        tier: 0
        basis: observed
        sources: [mt-disk, mt-policy]
        notes: "Signature packet: version 4, type 0x01 (canonical text), RSA, SHA1, issuer key id D3B280956F0E7CAF, which is the tail of the fingerprint the site publishes (B8A5 CFCA F63F F2D8 384A 6B12 D3B2 8095 6F0E 7CAF) and links to /pgp-key.txt; the fingerprint printed inside the letter is a different key. The signature's own creation time equals the capture clock (UTC) while the printed 'GMT' time is two hours later: the server prints local time labelled GMT. The FAQ tells users to verify with Gpg4win or the 'PGP Checker' at bitlist.co."
      signing_identity: {literal: D3B280956F0E7CAF, justification: "Issuer key id in both letters' signature packets, matching the fingerprint the site publishes; service-level."}
      verification: {tier: 0, basis: unknown, notes: "Investigator task: the signature should be verified against the published key (/pgp-key.txt) and the identity it names."}
    evidentiary_value:
      binds_facts: [deposit_address, destination_address, mix_mode, order_created_time]
      survives_server_purge: {tier: 0, basis: unknown, notes: "A user-side file, but the replay never reached the service, so nothing about server-side purging was observed."}
    field_map:
      value:
        "MixTum has generated the address": deposit_address
        "Cleansed coins will be sent to the forwarding address": destination_address
        "Anonymized coins will be sent to the destination address": destination_address
        "the change will be sent to the address": destination_address
        "valid for 168 hours from": order_created_time
        "starting from": order_created_time
        "Mixing mode:": mix_mode
        "Operation mode:": mix_mode
      tier: 0
      basis: observed
      sources: [mt-disk]
    artifact_refs: [letter_file, letter_download_record]
    attr:
      tier: 0
      basis: observed
      sources: [mt-flow, mt-disk]
      notes: "Templates are the two downloaded files with the order values replaced; wording, double spaces, trailing spaces and line breaks kept. The letter does not print the requested amount in the amount mode, nor any order number. The 'valid for 168 hours' line is a service rule and yields nothing beyond the start time."

# --- 8. Artifacts (disk-image observation mt-disk) ---------------------------------------
artifacts:
  - id: letter_file
    name: Letter of Guarantee (downloaded file)
    location: filesystem
    path_pattern: "<Downloads>/MixTum_guarantee_letter.txt (Chrome adds ' (<int>)' before the extension for repeated downloads)"
    filename_pattern: {regex: '^MixTum_guarantee_letter( \(<int>\))?\.txt$'}
    produced_by: letter_of_guarantee
    receipt_ref: letter_of_guarantee
    format: text/plain
    carries_facts: [deposit_address, destination_address, mix_mode, order_created_time, receipt]
    persistence_class: {value: disk, tier: 0, basis: observed, sources: [mt-disk]}
    recovery_route:
      value: "User's Downloads folder; the body carries the deposit address, the destination (and change) address, the mode name and the offer start time, and the signature packet carries the signing time in UTC. The fixed file name is the search key; search unallocated space for 'MixTum has generated the address'. The download row's start time and tab URL pair each file with its order."
      tier: 0
      basis: observed
      sources: [mt-disk]
    search_keys:
      - {regex: 'MixTum_guarantee_letter'}
      - {regex: 'MixTum has generated the address'}
      - {literal: D3B280956F0E7CAF, justification: "Issuer key id in the signature packet of every letter; service-level."}
    case_uco_class: uco-observable:File
    attr: {tier: 0, basis: observed, sources: [mt-disk]}
  - id: letter_download_record
    name: Download record of the Letter of Guarantee
    location: chrome_downloads
    path_pattern: "History: downloads.target_path, downloads.tab_url (https://mixtum.io/en/mix?mode=<mix_mode>), downloads_url_chains.url (blob:https://mixtum.io/<text>)"
    produced_by: letter_of_guarantee
    format: sqlite row
    carries_facts: [mix_mode, order_created_time, receipt]
    persistence_class: {value: disk, tier: 0, basis: observed, sources: [mt-disk]}
    recovery_route:
      value: "Chrome History DB, downloads and downloads_url_chains tables: one row per letter download with the file name, the tab URL whose mode parameter names the mode, a blob: URL and the start time (follows order creation by a user action); one row per download."
      tier: 0
      basis: observed
      sources: [mt-disk]
    search_keys:
      - {regex: 'MixTum_guarantee_letter'}
      - {regex: 'mixtum\.io/(en|ru|de)/mix\?mode=<mix_mode>', describes: mix_mode}
    attr: {tier: 0, basis: observed, sources: [mt-disk]}
  - id: page_visits
    name: Visits to the order form and order page
    location: chrome_history
    path_pattern: "History: urls.url and visits.visit_time for /en/mix and /en/mix?mode=<mix_mode>"
    produced_by: browser
    format: sqlite rows
    carries_facts: [mix_mode, order_created_time]
    persistence_class: {value: disk, tier: 0, basis: observed, sources: [mt-disk]}
    recovery_route:
      value: "Chrome History DB: the order page has the same URL as its form (/en/mix?mode=<mode>), so the visit recorded at submission time is the order creation and the mode parameter names the mode. No URL carries an address or the letter. Cloudflare challenge redirects add visits with __cf_chl_tk / __cf_chl_rt_tk query tokens and the title 'Just a moment...'."
      tier: 0
      basis: observed
      sources: [mt-disk]
    search_keys:
      - {regex: 'mixtum\.io/(en|ru|de)/mix(\?mode=<mix_mode>)?', describes: mix_mode}
      - {regex: 'Created New Order \| MixTum\.io'}
    caveat: {value: "The urls row keeps the title of the last visit only: 'Created New Order | MixTum.io' when the order page was the last visit of that URL, 'Create New Order | MixTum.io' when the form was reopened afterwards ('Send More Coins').", tier: 0, basis: observed, sources: [mt-disk]}
    attr: {tier: 0, basis: observed, sources: [mt-disk]}
  - id: session_restore_state
    name: Session restore navigation entries with the order form POST body
    location: chrome_sessions
    path_pattern: "Sessions/Session_<int> and Sessions/Tabs_<int> (SNSS)"
    produced_by: browser
    format: SNSS
    carries_facts: [destination_address, mix_mode]
    persistence_class: {value: disk, tier: 0, basis: observed, sources: [mt-disk]}
    recovery_route:
      value: "The navigation entry for a direct form submission keeps the POST body as ASCII (level=<int>&forward_addr=<btc_address>&forward_addr2=...) next to the page URL. When Cloudflare's challenge intercepts the submission, the entry kept is the re-post, whose body is only the challenge token field, so the addresses and amount are absent. No typed form state in UTF-16 was found."
      tier: 0
      basis: observed
      sources: [mt-disk]
    search_keys:
      - {regex: 'level=<int>&forward_addr=<btc_address>', describes: destination_address}
    caveat: {value: "Chrome 156 also writes a Sessions_Encrypted folder; if later versions stop writing plaintext session files, the POST bodies may no longer be readable from Sessions/.", tier: 0, basis: observed, sources: [mt-disk]}
    attr: {tier: 0, basis: observed, sources: [mt-disk]}
  - id: turnstile_local_storage
    name: Cloudflare Turnstile state partitioned for the service site
    location: chrome_local_storage
    path_pattern: "Local Storage/leveldb: records under the storage key https://challenges.cloudflare.com/^0https://mixtum.io (origin, '^0', top-level site): the record cf.turnstile.u and the META: and METAACCESS: rows for that storage key"
    produced_by: client_js
    format: leveldb records
    carries_facts: []
    persistence_class: {value: disk, tier: 0, basis: observed, sources: [mt-disk]}
    recovery_route:
      value: "Chrome Local Storage leveldb (.log and .ldb files): a record key is '_' + storage key + 0x00 0x01 + record name, here '_https://challenges.cloudflare.com/^0https://mixtum.io' followed by cf.turnstile.u; the '^0https://mixtum.io' suffix is the storage partition's top-level site, written when the Turnstile widget ran on a mixtum.io page. Evidence that a mixtum.io page with the challenge was loaded, nothing about an order."
      tier: 0
      basis: observed
      sources: [mt-disk]
    search_keys:
      - {regex: 'challenges\.cloudflare\.com/\^0https://mixtum\.io'}
    caveat: {value: "Cloudflare code shared by all sites behind Cloudflare; only the partition key names mixtum.io.", tier: 0, basis: observed, sources: [mt-disk]}
    attr: {tier: 0, basis: observed, sources: [mt-disk], notes: "The service's own origin writes nothing (see negative_findings)."}

# --- 9. Fact coverage: the stored fact-by-source matrix ----------------------------------
