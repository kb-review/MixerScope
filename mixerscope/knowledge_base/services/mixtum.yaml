# --- 10. Retention -----------------------------------------------------------------------
retention:
  stated_policy:
    - {value: "None. All info about an order is deleted upon its completion (or when the offer expires). The only remaining trace of our work are the letters of guarantee we give you.", tier: 0, basis: claimed, sources: [mt-policy], notes: "FAQ 12 'Do you store any logs in your system?'."}
    - {value: "We neither require registration nor store logs. Once the mixing is done and transaction confirmed, the data on processed transactions is deleted. Following up to 7 days during which we expect to receive your deposit, the data also gets erased.", tier: 0, basis: claimed, sources: [mt-policy], notes: "Home page, 'No registration, no logs'."}
    - {value: "They remain valid for 7 days.", tier: 0, basis: claimed, sources: [mt-policy], notes: "FAQ 15 on deposit addresses; the order form prints 'A generated address is valid for 7 days' and the letter 'This offer is valid for 168 hours'."}
  observed:
    - {value: "About 16 hours after the capture every replayed request, including those carrying the recorded cf_clearance cookie, was answered by Cloudflare's challenge page; the service was not reached, so whether it still held the orders is unknown", tier: 0, basis: observed, sources: [mt-replay]}
  consistency:
    value: untested
    tier: 0
    basis: inferred
    sources: [mt-policy, mt-replay]
    notes: "No request reached the origin on replay, and the service offers no lookup that could show whether an order record exists; the 7-day validity can only be tested by a deposit or by re-submitting a destination address and comparing deposit addresses, which was not done."

# --- 11. Negative findings ---------------------------------------------------------------
negative_findings:
  - location: chrome_local_storage
    finding: "Not written for the service origin"
    reason: "Page scripts make no Web Storage calls"
    implication: {value: "The only records naming the host are Cloudflare Turnstile entries under the challenges.cloudflare.com origin, partitioned for mixtum.io (artifact turnstile_local_storage)", tier: 0, basis: observed, sources: [mt-disk]}
    attr: {value: not_stored_by_design, tier: 0, basis: observed, sources: [mt-flow, mt-disk]}
  - location: chrome_session_storage
    finding: "Not written for the service origin"
    reason: "Page scripts make no Web Storage calls; no Session Storage file mentions the host"
    attr: {value: not_stored_by_design, tier: 0, basis: observed, sources: [mt-flow, mt-disk]}
  - location: chrome_indexeddb
    finding: "Not written for the service origin"
    reason: "Page scripts make no IndexedDB calls; the profile has no IndexedDB folder"
    attr: {value: not_stored_by_design, tier: 0, basis: observed, sources: [mt-flow, mt-disk]}
  - location: chrome_cache
    finding: "Letter never fetched as a resource"
    reason: "The page script builds the letter as a client-side Blob from a hidden field; no request is made"
    attr: {value: not_stored_by_design, tier: 0, basis: observed, sources: [mt-flow, mt-disk]}
  - location: chrome_cache
    finding: "No order page in the cache"
    reason: "Inferred: the order page is the response to a form POST, which Chrome normally does not reuse; no Cache-Control header explains the absence"
    attr: {value: not_found, tier: 0, basis: observed, sources: [mt-flow, mt-disk], notes: "The absence is observed (the cache holds the home page, the form pages /en/mix and /en/mix?mode=test and static assets, none carrying an order value); the reason is inferred, since Chrome can store a form POST response under an upload-identifier key."}
  - location: chrome_history
    finding: "No visited URL carries a deposit address, destination address, amount or the letter; the visit rows give only the mode (query parameter), the page title and the time"
    reason: "Form and order page share fixed paths; the letter is a Blob download; Cloudflare challenge redirects add __cf_chl_tk tokens, not order data"
    attr: {value: not_stored_by_design, tier: 0, basis: observed, sources: [mt-flow, mt-disk]}
  - location: chrome_downloads
    finding: "The download row carries no deposit address, destination address or amount; it gives the letter's file name, the mode and the time"
    reason: "Fixed file name and a blob: URL"
    attr: {value: not_stored_by_design, tier: 0, basis: observed, sources: [mt-flow, mt-disk]}
  - location: chrome_cookies
    finding: "No application cookie at all; the only row for the host is Cloudflare's cf_clearance"
    reason: "The service sets no Set-Cookie header; cf_clearance is set by the challenge platform"
    attr: {value: not_stored_by_design, tier: 0, basis: observed, sources: [mt-flow, mt-disk]}
  - location: chrome_autofill
    finding: "No row for the typed destination, change address or amount (the autofill table is empty)"
    reason: "Both order forms carry autocomplete=off, for which Chrome saves no form history"
    facts: [destination_address, amounts, order_created_time]
    attr: {value: not_stored_by_design, tier: 0, basis: observed, sources: [mt-flow, mt-disk]}
  - location: chrome_sessions
    finding: "Deposit address and letter text absent"
    reason: "Session restore keeps navigation entries and POST bodies; the deposit address and the hidden letter field are page content"
    attr: {value: not_found, tier: 0, basis: observed, sources: [mt-disk]}
  - location: chrome_sessions
    finding: "Amount-mode order absent: no forward_amount, destination or change address"
    reason: "The submission was intercepted by the Cloudflare challenge and re-posted with the challenge token as the only body field; only that re-post is in the navigation entry"
    implication: {value: "An unchallenged amount-mode submission would keep forward_amount in the POST body, as the mix-mode submission kept forward_addr; not tested", tier: 0, basis: inferred, sources: [mt-flow, mt-disk]}
    attr: {value: not_found, tier: 0, basis: observed, sources: [mt-flow, mt-disk]}

# --- 12. Indicators (weights are analyst-assigned specificity) ----------------------------
indicators:
  - kind: domain
    value: {literal: mixtum.io, justification: "The service's canonical domain."}
    weight: 1.0
    attr: {tier: 0, basis: observed, sources: [mt-flow, mt-policy]}
  - kind: string
    value: {literal: mixtumjzn2tsiusfkdhutntamspsg43kgt764qbdaxjebce4h6fcfiad.onion, justification: "The service's published onion name, linked from every page."}
    weight: 1.0
    attr: {tier: 0, basis: claimed, sources: [mt-policy]}
  - kind: string
    value: {regex: 'MixTum has generated the address'}
    weight: 1.0
    attr: {tier: 0, basis: observed, sources: [mt-disk], notes: "First line of every letter and of the hidden field on the order page."}
  - kind: string
    value: {literal: D3B280956F0E7CAF, justification: "Issuer key id in the signature packet of every letter; service-level."}
    weight: 1.0
    attr: {tier: 0, basis: observed, sources: [mt-disk]}
  - kind: string
    value: {literal: 63DFE7F602E8C7D50B1D2340FDAEC8327BBC8E99, justification: "Fingerprint printed inside every letter; service-level."}
    weight: 0.9
    attr: {tier: 0, basis: observed, sources: [mt-disk]}
  - kind: filename
    value: {regex: '^MixTum_guarantee_letter( \(<int>\))?\.txt$'}
    weight: 0.9
    attr: {tier: 0, basis: observed, sources: [mt-flow, mt-disk]}
  - kind: string
    value: {regex: 'Created New Order \| MixTum\.io'}
    weight: 0.8
    attr: {tier: 0, basis: observed, sources: [mt-flow, mt-disk], notes: "Title of the order page, recorded in History and session restore."}
  - kind: string
    value: {regex: 'level=<int>&forward_addr=<btc_address>&forward_addr2=', describes: destination_address}
    weight: 0.8
    attr: {tier: 0, basis: observed, sources: [mt-disk], notes: "Order-form POST body as kept by session restore."}
  - kind: url_path
    value: {regex: '^/(en|ru|de)/mix(\?mode=(mix|amount|test))?$'}
    weight: 0.7
    attr: {tier: 0, basis: observed, sources: [mt-flow, mt-disk]}
  - kind: string
    value: {regex: 'Mixing mode: Complete anonymity|Operation mode: Precise Payment'}
    weight: 0.8
    attr: {tier: 0, basis: observed, sources: [mt-disk], notes: "Mode lines of the two letter wordings."}
  - kind: string
    value: {regex: 'challenges\.cloudflare\.com/\^0https://mixtum\.io'}
    weight: 0.6
    attr: {tier: 0, basis: observed, sources: [mt-disk], notes: "Local Storage partition key of Cloudflare Turnstile state for the top-level site mixtum.io: evidence that the site was visited, not of an order; the Cloudflare origin itself is shared by every site behind that CDN."}
  - kind: string
    value: {regex: 'Powered by Jambler\.io'}
    weight: 0.3
    attr: {tier: 0, basis: observed, sources: [mt-flow], notes: "Footer of every page; shared with other Jambler-based front ends."}
  - kind: cookie_name
    value: {regex: '^cf_clearance$'}
    weight: 0.1
    attr: {tier: 0, basis: observed, sources: [mt-flow, mt-disk], notes: "Cloudflare; shared with every site behind that CDN."}
