      history: "not_stored_by_design: order pages live at /en/mix?mode=<mode>; no URL carries it"
      downloads: "not_stored_by_design: blob URL and a fixed file name"
      cache: "not_found: no order page in the cache (inferred reason: POST response)"
      cookies: "not_stored_by_design: the service sets no cookie"
      web_storage: "not_stored_by_design: page scripts make no storage calls"
      autofill: "not_stored_by_design: displayed, never typed"
      sessions: "not_found: page content is not part of session restore"
      filesystem: "recovered: letter body"
      replay: "not_tested: every replayed request was answered by the CDN challenge"
      chain: not_tested
    attr: {tier: 0, basis: observed, sources: [mt-disk, mt-replay]}
  - fact: destination_address
    best_persistence: disk
    artifacts: [letter_file, session_restore_state]
    cells:
