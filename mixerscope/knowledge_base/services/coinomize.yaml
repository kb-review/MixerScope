# --- 10. Retention -----------------------------------------------------------------------
retention:
  stated_policy:
    - {
        value: "We do not store any logs of your transaction, not even your IP or Bitcoin addresses. We delete all orders after 24-72 hours (Depending on choosen delay time.), but you can also delete it by yourself.",
        tier: 0,
        basis: claimed,
        sources: [cz-policy],
        notes: "FAQ.",
      }
    - {
        value: "an auto-deletion occurs after 72 hours removing the records permanently",
        tier: 0,
        basis: claimed,
        sources: [cz-policy],
        notes: "Home page.",
      }
    - {
        value: "Your order is valid for 3 days and will be deleted after this time!",
        tier: 0,
        basis: claimed,
        sources: [cz-policy],
        notes: "Order page and status page; the status page prints an 'Order Valid until' time three days after creation.",
      }
    - {
        value: "Your order is valid for 24 hours and will be deleted if no coins are received!",
        tier: 0,
        basis: claimed,
        sources: [cz-policy],
        notes: "Letter of Guarantee; contradicts the 3 days on the order page.",
      }
    - {
        value: "The data will be deleted after 3 days.",
        tier: 0,
        basis: claimed,
        sources: [cz-policy],
        notes: "Error page for a destination address already in an open order.",
      }
  observed:
    - {
        value: "About 78 hours after creation, past the 'valid until' time the service prints, the lookup by order number still returned the full record of the unfunded order (number, creation time, fee, delay, destination and deposit addresses, waiting state)",
        tier: 0,
        basis: observed,
        sources: [cz-replay],
      }
    - {
        value: "The recorded PHP session no longer resolved to the order: the order page redirected to /mix-error and the letter URL to the home page",
        tier: 0,
        basis: observed,
        sources: [cz-replay],
      }
  consistency:
    value: contradicted
    tier: 0
    basis: inferred
    sources: [cz-policy, cz-replay]
    notes: "The unfunded order was still served about 78 hours after creation, past the 24-hour (letter) and 3-day (order page) deadlines. One replay; deletion may be batched or delayed rather than absent. A later replay would settle it. The 'no logs' claim is untested."

# --- 11. Negative findings ---------------------------------------------------------------
negative_findings:
  - location: chrome_local_storage
    finding: "Not written for the service origin"
    reason: "Page scripts make no Web Storage calls; no Local Storage file mentions the host"
    attr:
      {
        value: not_stored_by_design,
        tier: 0,
        basis: observed,
        sources: [cz-flow, cz-disk],
      }
  - location: chrome_session_storage
    finding: "Not written for the service origin"
    reason: "Page scripts make no Web Storage calls; no Session Storage file mentions the host"
    attr:
      {
        value: not_stored_by_design,
        tier: 0,
        basis: observed,
        sources: [cz-flow, cz-disk],
      }
  - location: chrome_indexeddb
    finding: "Not written for the service origin"
    reason: "Page scripts make no IndexedDB calls; no IndexedDB file mentions the host"
    attr:
      {
        value: not_stored_by_design,
        tier: 0,
        basis: observed,
        sources: [cz-flow, cz-disk],
      }
  - location: chrome_cache
    finding: "Order page, status page, order form, expiry page and letter absent; the cache holds the home page, the /exist-error page and static assets"
    reason: "Served with Cache-Control: no-store, no-cache, must-revalidate; the cached home page carries only the service's signing/donation address"
    attr:
      {
        value: not_stored_by_design,
        tier: 0,
        basis: observed,
        sources: [cz-flow, cz-disk],
      }
  - location: chrome_history
    finding: "No visited URL carries an order value (deposit address, destination address, order number, code, fee or delay); only the visit times remain"
    reason: "Order and status pages live at fixed paths with the state in the PHP session; the only URL with the order number is the letter download, which Chrome records as a download rather than a visit"
    attr:
      {
        value: not_stored_by_design,
        tier: 0,
        basis: observed,
        sources: [cz-flow, cz-disk],
      }
  - location: chrome_downloads
    finding: "The download record carries no order value other than the order number (plus the download time)"
    reason: "The letter URL and file name contain the order number and nothing else"
    attr:
      {
        value: not_stored_by_design,
        tier: 0,
        basis: observed,
        sources: [cz-flow, cz-disk],
      }
  - location: chrome_cookies
    finding: "No PHPSESSID row"
    reason: "Session cookie without Expires or Max-Age; Chrome does not persist it on a normal exit"
    facts: [session_id]
    attr:
      {
        value: not_stored_by_design,
        tier: 0,
        basis: observed,
        sources: [cz-flow, cz-disk],
      }
  - location: chrome_cookies
    finding: "No cookie carries an order value"
    reason: "The Set-Cookie headers in the capture carry the PHP session id, DDoS-Guard tokens and the client IP only"
    facts: [deposit_address, destination_address, order_id, fee_and_delay, user_identifier]
    attr:
      {
        value: not_stored_by_design,
        tier: 0,
        basis: observed,
        sources: [cz-flow, cz-disk],
      }
  - location: chrome_autofill
    finding: "Deposit address absent"
    reason: "Displayed by the service, never typed"
    facts: [deposit_address]
    attr:
      {
        value: not_stored_by_design,
        tier: 0,
        basis: observed,
        sources: [cz-flow, cz-disk],
      }
  - location: chrome_autofill
    finding: "Fee and delay absent"
    reason: "Both are range inputs on the form; Chrome autofill saves text fields only"
    facts: [fee_and_delay]
    attr:
      {
        value: not_stored_by_design,
        tier: 0,
        basis: observed,
        sources: [cz-flow, cz-disk],
      }
  - location: chrome_sessions
    finding: "Deposit address, Coinomize Code and session id absent"
    reason: "Session restore keeps navigation entries, POST bodies and typed form state; the deposit address and the code are server-rendered page content, the session id is a cookie"
    attr: { value: not_found, tier: 0, basis: observed, sources: [cz-disk] }

