# --- 10. Retention -----------------------------------------------------------------------
retention:
  stated_policy:
    - {
        value: "Transaction details are kept only until the mix completes and is confirmed",
        tier: 0,
        basis: claimed,
        sources: [mx-policy],
      }
    - {
        value: "No trace remains after the 24-hour session",
        tier: 0,
        basis: claimed,
        sources: [mx-policy],
      }
    - {
        value: "The letter of guarantee must be submitted within 48 hours of payment if problems arise. Failure to comply will invalidate the letter per our Data Confidentiality policy. If a delay is set, the letter expires 48 hours after this delay.",
        tier: 0,
        basis: claimed,
        sources: [mx-policy],
        notes: "Printed in the Letter of Guarantee (cached body and downloaded file).",
      }
  observed:
    - {
        value: "Completion record (payout TXID) no longer served about two weeks after completion",
        tier: 1,
        basis: observed,
        sources: [mx-replay],
      }
    - {
        value: "Superseded session identifiers still accepted about two weeks later; deposit-address resolution still works",
        tier: 1,
        basis: observed,
        sources: [mx-replay],
      }
  consistency:
    {
      value: partially_consistent,
      tier: 1,
      basis: inferred,
      sources: [mx-policy, mx-replay],
      notes: "First claim consistent with the purge; second contradicted by the validity of old sessions.",
    }

# --- 11. Negative findings ---------------------------------------------------------------
negative_findings:
