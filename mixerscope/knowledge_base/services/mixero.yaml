# replay, chain. A cell is `<value>` or `<value>: <detail>`.
fact_coverage:
  - fact: deposit_address
    best_persistence: disk
    artifacts: [letter_file, letter_cache_entry, session_restore_state]
    cells:
      {
        history: not_found,
        downloads: not_found,
        cache: "recovered: letter.php cache entry (address= in the key; letter body)",
        cookies: not_found,
        web_storage: not_stored_by_design,
        autofill: "not_stored_by_design: displayed, never typed",
        sessions: "recovered: page state",
        filesystem: "recovered: letter body",
